name: person-lab  # Preserve existing PostgreSQL volume and container names after the product rename.
services:
  db:
    image: postgres:17-alpine
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_DB: person_lab
      POSTGRES_USER: person_lab
      POSTGRES_PASSWORD: local_password
    volumes:
      - person_lab_pg:/var/lib/postgresql/data
volumes:
  person_lab_pg:
